name: Regenerate package-lock

on:
  push:
    branches:
      - sync/review-updates-20260908
    paths:
      - .github/workflows/regenerate-package-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: sync/review-updates-20260908

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Install dependencies and write lockfile
        run: |
          npm install --ignore-scripts --omit=optional
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); const v=l.packages['node_modules/kordoc'].version; if (v !== p.dependencies.kordoc) { throw new Error('kordoc mismatch '+v+' vs '+p.dependencies.kordoc); } console.log('kordoc', v);"

      - name: Commit package-lock.json and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/regenerate-package-lock.yml
          git add package-lock.json
          git add -u .github/workflows/regenerate-package-lock.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
            exit 0
          fi
          git commit -m "chore: regenerate package-lock.json for Kordoc 4.13.1"
          git push
